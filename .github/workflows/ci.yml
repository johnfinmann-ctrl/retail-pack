name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck (alle pakker via project references)
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
